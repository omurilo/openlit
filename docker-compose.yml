services:
  # ---- ClickHouse Keeper quorum (3 nodes) ----
  clickhouse-keeper-1:
    image: clickhouse/clickhouse-keeper:24.4.1
    container_name: clickhouse-keeper-1
    environment:
      KEEPER_SERVER_ID: "1"
    volumes:
      - keeper-1-data:/var/lib/clickhouse
      - ./assets/clickhouse-keeper-config.xml:/etc/clickhouse-keeper/config.d/keeper.xml:ro
    networks:
      - ch-cluster
    restart: always

  clickhouse-keeper-2:
    image: clickhouse/clickhouse-keeper:24.4.1
    container_name: clickhouse-keeper-2
    environment:
      KEEPER_SERVER_ID: "2"
    volumes:
      - keeper-2-data:/var/lib/clickhouse
      - ./assets/clickhouse-keeper-config.xml:/etc/clickhouse-keeper/config.d/keeper.xml:ro
    networks:
      - ch-cluster
    restart: always

  clickhouse-keeper-3:
    image: clickhouse/clickhouse-keeper:24.4.1
    container_name: clickhouse-keeper-3
    environment:
      KEEPER_SERVER_ID: "3"
    volumes:
      - keeper-3-data:/var/lib/clickhouse
      - ./assets/clickhouse-keeper-config.xml:/etc/clickhouse-keeper/config.d/keeper.xml:ro
    networks:
      - ch-cluster
    restart: always

  # ---- ClickHouse Server replica 1 ----
  clickhouse-1:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: clickhouse-1
    environment:
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD:-OPENLIT}
      CLICKHOUSE_USER: ${OPENLIT_DB_USER:-default}
      CLICKHOUSE_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      CLICKHOUSE_CLUSTER: openlit_cluster
      CLICKHOUSE_REPLICA: replica-1
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: true
    volumes:
      - clickhouse-1-data:/var/lib/clickhouse
      - ./assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./assets/clickhouse-cluster-config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "9000:9000"
      - "8123:8123"
    depends_on:
      - clickhouse-keeper-1
      - clickhouse-keeper-2
      - clickhouse-keeper-3
    networks:
      - ch-cluster
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s
    restart: always

  # ---- ClickHouse Server replica 2 ----
  clickhouse-2:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: clickhouse-2
    environment:
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD:-OPENLIT}
      CLICKHOUSE_USER: ${OPENLIT_DB_USER:-default}
      CLICKHOUSE_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      CLICKHOUSE_CLUSTER: openlit_cluster
      CLICKHOUSE_REPLICA: replica-2
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: true
    volumes:
      - clickhouse-2-data:/var/lib/clickhouse
      - ./assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./assets/clickhouse-cluster-config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "9001:9000"
      - "8124:8123"
    depends_on:
      - clickhouse-keeper-1
      - clickhouse-keeper-2
      - clickhouse-keeper-3
    networks:
      - ch-cluster
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s
    restart: always

  openlit:
    image: flashapp/flashstage.service.openlit:latest
    container_name: openlit
    environment:
      TELEMETRY_ENABLED: "true"
      INIT_DB_HOST: clickhouse-1
      INIT_DB_PORT: 8123
      INIT_DB_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      INIT_DB_USERNAME: ${OPENLIT_DB_USER:-default}
      INIT_DB_PASSWORD: ${OPENLIT_DB_PASSWORD:-OPENLIT}
      CLICKHOUSE_CLUSTER: openlit_cluster
      PORT: ${PORT:-3000}
      DOCKER_PORT: ${PORT:-3000}
      
      # OAuth Environment Variables
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      
      # TLS Configuration (user-configurable)
      OPAMP_ENVIRONMENT: ${OPAMP_ENVIRONMENT:-production}
      OPAMP_CERTS_DIR: "/app/opamp/certs"
      OPAMP_TLS_INSECURE_SKIP_VERIFY: ${OPAMP_TLS_INSECURE_SKIP_VERIFY:-false}
      OPAMP_TLS_REQUIRE_CLIENT_CERT: ${OPAMP_TLS_REQUIRE_CLIENT_CERT:-true}
      OPAMP_TLS_MIN_VERSION: ${OPAMP_TLS_MIN_VERSION:-1.2}
      OPAMP_TLS_MAX_VERSION: ${OPAMP_TLS_MAX_VERSION:-1.3}
      OPAMP_LOG_LEVEL: ${OPAMP_LOG_LEVEL:-info}

    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-3000}:${DOCKER_PORT:-3000}"
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    depends_on:
      clickhouse-1:
        condition: service_healthy
      clickhouse-2:
        condition: service_healthy
    networks:
      - ch-cluster
    volumes:
      - ./assets/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://openlit:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: always

networks:
  ch-cluster:
    driver: bridge

volumes:
  clickhouse-1-data:
  clickhouse-2-data:
  keeper-1-data:
  keeper-2-data:
  keeper-3-data:
  openlit-data:
